<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0c1938"/>
      <stop offset="60%" stop-color="#050a17"/>
      <stop offset="100%" stop-color="#020409"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- TT Letter Gradient -->
    <linearGradient id="ttGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- X Letter Laser Gradient -->
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Drop Shadow / Glow Filter -->
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded Squircle Base with Border -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="20" />

  <!-- Subtle Cyber Corner Accents -->
  <path d="M 64 160 L 64 96 L 128 96" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 448 352 L 448 416 L 384 416" fill="none" stroke="#818cf8" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- Core TTX Monogram Mark -->
  <g filter="url(#laserGlow)" transform="translate(18, 12)">
    <!-- First 'T' -->
    <!-- Top Horizontal Bar -->
    <path d="M 80 160 L 210 160 L 210 205 L 165 205 L 165 350 L 115 350 L 115 205 L 80 205 Z" fill="url(#ttGrad)"/>

    <!-- Second 'T' (Offset & Layered) -->
    <path d="M 190 160 L 305 160 L 305 205 L 268 205 L 268 350 L 218 350 L 218 205 L 190 205 Z" fill="#e2e8f0" opacity="0.95"/>

    <!-- High-Energy Cyber 'X' -->
    <!-- Diagonal 1 -->
    <polygon points="275,160 345,160 435,350 365,350" fill="url(#xGrad)"/>
    <!-- Diagonal 2 with Center Notch Intersect -->
    <polygon points="435,160 365,160 275,350 345,350" fill="url(#xGrad)"/>
    
    <!-- Central Energy Core Spark -->
    <circle cx="355" cy="255" r="16" fill="#ffffff" filter="url(#laserGlow)"/>
  </g>
</svg>
